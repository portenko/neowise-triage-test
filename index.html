<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const notice = document.querySelector("#notice");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const submit = form.querySelector("button");
    const TOPIC_NAMES = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    let lastRequest = 0;

    function clearResult() {
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequest;
      clearResult();
      if (message.value.trim() === "") {
        notice.textContent = "Введите текст заявки.";
        return;
      }
      notice.textContent = "Разбираю заявку…";
      submit.disabled = true;
      let data = null;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        data = await reply.json();
      } catch {
        data = null;
      }
      if (requestId !== lastRequest) return; // a newer request owns the screen
      submit.disabled = false;
      if (data?.status === "ready") {
        notice.textContent = "";
        topic.textContent = TOPIC_NAMES[data.topic] ?? data.topic;
        draft.textContent = data.draft;
        result.hidden = false;
      } else if (data?.status === "manual_review") {
        notice.textContent = "AI не смог разобрать заявку. Прочитайте её и ответьте клиенту вручную.";
      } else if (data?.status === "invalid_input") {
        notice.textContent = "Введите текст заявки.";
      } else {
        notice.textContent = "Сервис недоступен. Попробуйте ещё раз или ответьте вручную.";
      }
    });
  </script>
</body>
</html>
